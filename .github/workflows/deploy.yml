# Build et publication sur GitHub Pages à chaque push sur main.
# La connexion Supabase vient du fichier .env.supabase (URL et clé publique du projet) : aucun secret à créer.
name: Deploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build (connecté à Supabase)
        run: npm run build:prod
        env:
          # Chemin du site : /nom-du-depot/ par défaut, ou la variable de dépôt BASE_PATH (ex : / pour un domaine personnalisé).
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
